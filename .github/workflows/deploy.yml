name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          set -e
          npm run build
          echo ""
          echo "=== Verifying dist ==="
          test -f dist/index.html && echo "✓ index.html"
          test -f dist/404.html && echo "✓ 404.html"
          test -f dist/CNAME && echo "✓ CNAME"
          test -d dist/assets && echo "✓ assets/"
          test -f dist/sitemap.xml && echo "✓ sitemap.xml"
          test -f dist/robots.txt && echo "✓ robots.txt"
          echo "✅ All checks passed"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
